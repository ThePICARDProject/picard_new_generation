services:
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ./backend/.env
    #Persistent storage for mysql server
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:5000"
    #Always bring it up again
    restart: always
    #Suggested so that it can live update instead of rebuilding docker image.
    volumes:
      - ./backend/media:/app/media #Allows spark-master to read files.
      - ./backend:/app
      - ./spark-apps:/opt/spark/apps:rw
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - SPARK_SHARED_DIR=/opt/spark/apps
    depends_on:
      db:
        condition: service_healthy
  # Note: The ${VARIABLE:-default} syntax reads the selected environment file and uses the fallback if the variable is missing or empty.
  celery_worker:
    build: ./backend
    command: celery -A backend_config worker --concurrency=${CELERY_CONCURRENCY:-1} --loglevel=info
    volumes:
      - ./backend:/app
      - ./spark-apps:/opt/spark/apps:rw
    env_file:
      - ./backend/.env
    environment:
      - SPARK_SHARED_DIR=/opt/spark/apps
      - SPARK_DRIVER_MEMORY=${SPARK_DRIVER_MEMORY:-1g}
      - SPARK_EXECUTOR_MEMORY=${SPARK_EXECUTOR_MEMORY:-1g}
      - SPARK_EXECUTOR_CORES=${SPARK_EXECUTOR_CORES:-1}
      - SPARK_MAX_CORES=${SPARK_MAX_CORES:-2}
    depends_on:
      - db
      - redis
      - backend
    # This container runs Celery and the Spark driver.
    deploy:
      resources:
        limits:
          cpus: "${CELERY_CPU_LIMIT:-2}"
          memory: "${CELERY_MEMORY_LIMIT:-3G}"
  # 3. The Message Broker (Required for Celery)
  redis:
    image: redis:alpine
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bubble-app1
    #Unfixed it and then fixed it :)
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend

  spark-master:
    build: ./spark-cluster
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "127.0.0.1:18080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master service port
    volumes:
      - ./backend/media:/app/media:ro #Read only for datasets.
      - ./spark-apps:/opt/spark/apps # Official image uses /opt/spark/
    command: /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.master.Master


  spark-worker:
    build: ./spark-cluster
    # Local-development quick fix: the Spark driver currently runs as root
    # inside Celery and creates the shared result directory as root. Match the
    # executor UID so it can write result parts. Production should instead use
    # a shared, non-root UID/group for the driver and workers.
    user: "0:0"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "8081:8081"
    volumes:
      - ./backend/media:/app/media:ro #Read only for datasets.
      - ./spark-apps:/opt/spark/apps
    command: /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
  
    depends_on:
      - spark-master
volumes:
  db_data:
